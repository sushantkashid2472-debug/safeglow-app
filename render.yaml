services:
  - type: web
    name: safeglow-companion
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SAFEGLOW_DB_PATH
        value: /tmp/safeglow.db
